name: Update Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution histogram
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-contributions.mjs

      - name: Render vinyl with visitor counter
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick > /dev/null 2>&1

          rsvg-convert -w 800 -h 800 assets/vinyl-template.svg -o /tmp/vinyl_base.png

          curl -sL "https://komarev.com/ghpvc/?username=Mayur11code&style=flat&label=&color=96999d&labelColor=08090b&background=08090b" -o /tmp/badge.svg

          if [ -s /tmp/badge.svg ] && head -c 100 /tmp/badge.svg | grep -q '<svg'; then
            rsvg-convert -w 120 -h 52 /tmp/badge.svg -o /tmp/badge.png
            convert /tmp/vinyl_base.png \
              /tmp/badge.png \
              -gravity center -geometry +0+0 \
              -composite assets/vinyl.png
            echo "Badge composited onto vinyl ($(wc -c < assets/vinyl.png) bytes)"
          else
            cp /tmp/vinyl_base.png assets/vinyl.png
            echo "Badge fetch failed, using plain vinyl"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f assets/vinyl.png ]; then
            sed -i 's|src="assets/vinyl.svg"|src="assets/vinyl.png"|' README.md
          fi
          git add assets/contributions.svg assets/vinyl.png README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution histogram and visitor counter"
            git pull --rebase origin main
            git push
          fi
