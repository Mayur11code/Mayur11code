name: Update Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution histogram
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-contributions.mjs

      - name: Render vinyl record
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null 2>&1
          rsvg-convert -w 800 -h 800 assets/vinyl-template.svg -o assets/vinyl.png
          echo "Vinyl rendered ($(wc -c < assets/vinyl.png) bytes)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/vinyl.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution histogram and vinyl"
            # Force-with-lease is safe here because this workflow only
            # commits auto-generated assets. The user's source code is
            # never overwritten. This prevents stale merge conflicts on
            # the binary vinyl.png when the user pushes between runs.
            git push --force-with-lease origin main
          fi
