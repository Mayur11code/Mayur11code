name: Update Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution histogram
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-contributions.mjs

      - name: Publish contribution SVG to Vercel
        run: cp assets/contributions.svg mayur-vinyl/public/contributions.svg

      - name: Bust vinyl image cache
        run: |
          ts=$(date +%s)
          sed -i "s|api/vinyl[^\"']*\([\"']\)|api/vinyl?v=$ts\1|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg mayur-vinyl/public/contributions.svg README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contributions"
            git pull --rebase origin main
            git push --force-with-lease origin main
          fi
