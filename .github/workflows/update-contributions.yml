name: Update Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution histogram
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-contributions.mjs

      - name: Render contribution histogram to PNG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null 2>&1
          rsvg-convert -w 1208 -o assets/contributions.png assets/contributions.svg
          echo "PNG rendered ($(wc -c < assets/contributions.png) bytes)"

      - name: Bust GitHub image cache
        run: |
          ts=$(date +%s)
          sed -i "s|api/vinyl[^\"']*\([\"']\)|api/vinyl?v=$ts\1|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/contributions.png README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contributions + bust image cache"
            git pull --rebase origin main
            git push --force-with-lease origin main
          fi
