<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
    <radialGradient id="refl" cx="40%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══ ROTATING VINYL GROUP ═══ -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 200 200"
      to="360 200 200"
      dur="10s"
      repeatCount="indefinite"
    />

    <!-- Body -->
    <circle cx="200" cy="200" r="197" fill="#08090b"/>
    <circle cx="200" cy="200" r="195" fill="#0e1013"/>

    <!-- Raised outer rim -->
    <circle cx="200" cy="200" r="193" fill="none" stroke="#292c30" stroke-width="1.2" opacity="0.5"/>
    <circle cx="200" cy="200" r="191" fill="none" stroke="#1a1d21" stroke-width="0.6" opacity="0.6"/>

    <!-- Groove field base -->
    <circle cx="200" cy="200" r="189" fill="#0e1013"/>

    <!-- Zone 1: Outer (r=188 to r=142) -->
    <circle cx="200" cy="200" r="188" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.55"/>
    <circle cx="200" cy="200" r="184" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.4"/>
    <circle cx="200" cy="200" r="180" fill="none" stroke="#45484c" stroke-width="0.3" opacity="0.2"/>
    <circle cx="200" cy="200" r="176" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="172" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.15"/>
    <circle cx="200" cy="200" r="168" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.45"/>
    <circle cx="200" cy="200" r="164" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.35"/>
    <circle cx="200" cy="200" r="160" fill="none" stroke="#45484c" stroke-width="0.3" opacity="0.2"/>
    <circle cx="200" cy="200" r="156" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="152" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.3"/>
    <circle cx="200" cy="200" r="148" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.18"/>
    <circle cx="200" cy="200" r="144" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.45"/>

    <!-- Zone 2: Middle (r=140 to r=96) -->
    <circle cx="200" cy="200" r="140" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.4"/>
    <circle cx="200" cy="200" r="135" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.18"/>
    <circle cx="200" cy="200" r="130" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="125" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.35"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#45484c" stroke-width="0.3" opacity="0.22"/>
    <circle cx="200" cy="200" r="115" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.45"/>
    <circle cx="200" cy="200" r="110" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.3"/>
    <circle cx="200" cy="200" r="105" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.18"/>
    <circle cx="200" cy="200" r="100" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="96" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.35"/>

    <!-- Zone 3: Inner (r=92 to r=62) -->
    <circle cx="200" cy="200" r="92" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="88" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.2"/>
    <circle cx="200" cy="200" r="84" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.45"/>
    <circle cx="200" cy="200" r="80" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.35"/>
    <circle cx="200" cy="200" r="76" fill="none" stroke="#45484c" stroke-width="0.3" opacity="0.2"/>
    <circle cx="200" cy="200" r="72" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="68" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.35"/>
    <circle cx="200" cy="200" r="64" fill="none" stroke="#45484c" stroke-width="0.35" opacity="0.18"/>
    <circle cx="200" cy="200" r="60" fill="none" stroke="#292c30" stroke-width="0.5" opacity="0.45"/>

    <!-- Depth bands -->
    <circle cx="200" cy="200" r="186" fill="#0b0d0f" opacity="0.3"/>
    <circle cx="200" cy="200" r="166" fill="#0e1013" opacity="0.2"/>
    <circle cx="200" cy="200" r="146" fill="#0b0d0f" opacity="0.25"/>
    <circle cx="200" cy="200" r="126" fill="#0e1013" opacity="0.2"/>
    <circle cx="200" cy="200" r="106" fill="#0b0d0f" opacity="0.25"/>
    <circle cx="200" cy="200" r="86" fill="#0e1013" opacity="0.2"/>
    <circle cx="200" cy="200" r="66" fill="#0b0d0f" opacity="0.25"/>

    <!-- Lead-in groove -->
    <circle cx="200" cy="200" r="191" fill="none" stroke="#45484c" stroke-width="0.8" opacity="0.2"/>

    <!-- Reflection (rotates with record — simulates surface sheen) -->
    <circle cx="200" cy="200" r="193" fill="url(#refl)"/>

    <!-- Grain (rotates with record — surface texture) -->
    <circle cx="200" cy="200" r="197" fill="#45484c" opacity="0.015" filter="url(#grain)"/>
  </g>

  <!-- ═══ STATIONARY CENTER ═══ -->
  <g>
    <!-- Dead wax ring -->
    <circle cx="200" cy="200" r="58" fill="#0e1013"/>
    <circle cx="200" cy="200" r="57" fill="none" stroke="#292c30" stroke-width="0.4" opacity="0.5"/>

    <!-- Center label -->
    <circle cx="200" cy="200" r="55" fill="#08090b"/>
    <circle cx="200" cy="200" r="54.5" fill="none" stroke="#292c30" stroke-width="0.3" opacity="0.3"/>
    <circle cx="200" cy="200" r="42" fill="none" stroke="#292c30" stroke-width="0.25" opacity="0.2"/>

    <!-- Counter text (stationary) -->
    <text x="200" y="195" font-family="'Courier New','Lucida Console',monospace" font-size="22" font-weight="bold" fill="#c5c7ca" text-anchor="middle" dominant-baseline="auto">223</text>
    <text x="200" y="215" font-family="'Courier New','Lucida Console',monospace" font-size="8" fill="#686b70" text-anchor="middle" letter-spacing="2">VIEWS</text>
  </g>
</svg>
